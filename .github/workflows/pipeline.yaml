name: CI

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:   

jobs:
  Integration:
    runs-on: ubuntu-latest
    steps:
      - name: Pull repository.
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install.
        run: |
          sudo apt-get update --yes
          sudo apt-get install --yes bison cmake flex gcc make
          chmod u+x --recursive src/main/bash
      - name: Build.
        run: src/main/bash/build.sh
      - name: Test.
        run: src/main/bash/test.sh
        
